# nginx untuk SPA new-hydro-canal (dipakai client/Dockerfile).
# SPA fallback + proxy /api ke service "server" (docker-compose network).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Aset hashed Vite — cache panjang, immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API → service backend. FE selalu panggil /api (vite proxy saat dev,
  # nginx proxy saat prod). /api di-strip biar sampai ke route asli server.
  location /api/ {
    proxy_pass http://server:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # SSE (sync pull / notifikasi) — jangan buffer, jangan timeout cepat.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # SPA fallback — semua route non-file → index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
